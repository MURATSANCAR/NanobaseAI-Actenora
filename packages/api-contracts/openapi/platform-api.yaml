openapi: 3.1.0
info:
  title: Actenora Platform API
  version: 0.1.0
  description: Bootstrap contract surface for the modular monolith.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness/readiness for platform-backend
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, modules]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        service:
          type: string
        modules:
          type: array
          items:
            type: string

openapi: 3.1.0
info:
  title: Actenora Platform API
  version: 0.2.0
  description: Platform + web-portal contract surface for the modular monolith (FAZ 24).
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness/readiness for platform-backend
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Authenticated portal principal
      description: >-
        Domain identity surface returns UserView. Prefer GET /api/v1/portal/me for web-portal
        PortalUser shapes (FAZ 33).
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"

  /api/v1/portal/me:
    get:
      operationId: getPortalCurrentUser
      summary: Authenticated portal principal (portal BFF)
      responses:
        "200":
          description: Current user in portal shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"

  /api/v1/portal/dashboard:
    get:
      operationId: getPortalDashboard
      summary: Portal dashboard aggregates (BFF)
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /api/v1/portal/meetings:
    get:
      operationId: listPortalMeetings
      summary: Cursor-paginated meeting list (portal BFF)
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Meeting page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"

  /api/v1/portal/meetings/{meetingId}:
    get:
      operationId: getPortalMeetingDetail
      summary: Full meeting detail for three-panel view (portal BFF)
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetailResponse"

  /api/v1/dashboard:
    get:
      operationId: getDashboard
      summary: Portal dashboard aggregates
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /api/v1/meetings:
    get:
      operationId: listMeetings
      summary: Cursor-paginated meeting list
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Meeting page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"

  /api/v1/meetings/{meetingId}:
    get:
      operationId: getMeetingDetail
      summary: Full meeting detail for three-panel view
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetailResponse"

  /api/v1/meetings/{meetingId}/transcript:
    get:
      operationId: getMeetingTranscript
      summary: Normalized transcript segments for virtualization
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: speaker
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"

  /api/v1/meetings/{meetingId}/notes/{noteId}:
    put:
      operationId: updateMeetingNote
      summary: Update shared or private note (optimistic-safe)
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingNote"

  /api/v1/approvals/{approvalId}/decide:
    post:
      operationId: decideApproval
      summary: Approve, reject, or request changes on an approval request
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecord"

  /api/v1/meeting-notes/{noteId}/submit-for-approval:
    post:
      operationId: submitMeetingNoteForApproval
      summary: Submit a draft meeting note version for human approval
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitForApprovalRequest"
      responses:
        "200":
          description: Approval opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecord"

  /api/v1/approvals/{approvalId}:
    get:
      operationId: getApproval
      summary: Fetch approval request status
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approval snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecord"

  /api/v1/delivery/orders:
    post:
      operationId: requestDeliveryOrder
      summary: Create a READY delivery order for a GRANTED approval (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDeliveryOrder"
      responses:
        "200":
          description: Delivery order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrder"
        "409":
          description: Approval not granted for note version

  /api/v1/delivery/orders/{orderId}:
    get:
      operationId: getDeliveryOrder
      summary: Fetch a delivery order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Delivery order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrder"

  /api/v1/delivery/orders/{orderId}/enqueue:
    post:
      operationId: enqueueDeliveryOrder
      summary: Enqueue recipient mail dispatches for a READY delivery order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueDeliveryRequest"
      responses:
        "200":
          description: Enqueue result (created + duplicate ids)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueDeliveryResponse"
        "409":
          description: Order not READY or note not approved

  /api/v1/delivery/requests/{requestId}:
    get:
      operationId: getDeliveryRequestStatus
      summary: Fetch delivery request status
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRequestStatus"

  /api/v1/delivery/requests/{requestId}/confirm-delivered:
    post:
      operationId: confirmDeliveryRequest
      summary: Promote PROVIDER_ACCEPTED to DELIVERED after external confirmation
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRequestStatus"
        "409":
          description: Request is not PROVIDER_ACCEPTED

  /api/v1/delivery/webhooks/provider-delivered:
    post:
      operationId: providerDeliveredWebhook
      summary: Provider callback promoting PROVIDER_ACCEPTED to DELIVERED (shared-secret auth)
      parameters:
        - name: X-Actenora-Delivery-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderDeliveredWebhook"
      responses:
        "200":
          description: Delivery confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDeliveredWebhookResult"
        "401":
          description: Invalid webhook secret
        "409":
          description: Request is not PROVIDER_ACCEPTED

  /api/v1/microsoft/webhooks/graph-notifications:
    post:
      operationId: microsoftGraphNotifications
      summary: >-
        Microsoft Graph change/lifecycle notification webhook (clientState auth).
        Echoes validationToken on the subscription handshake; dispatches notifications idempotently.
      parameters:
        - name: validationToken
          in: query
          required: false
          description: Present only on the subscription validation handshake; must be echoed as text/plain
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphNotificationBatch"
      responses:
        "200":
          description: Validation handshake — validationToken echoed back
          content:
            text/plain:
              schema:
                type: string
        "202":
          description: Notifications accepted (processed / duplicate / rejected counts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphWebhookResult"
        "400":
          description: Empty or invalid notification batch

  /api/v1/delivery/drain:
    post:
      operationId: drainDeliveryWorker
      summary: Process one batch of due queued delivery requests (local worker)
      responses:
        "200":
          description: Drain outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDrainResponse"

  /api/v1/continuity-ledger/events:
    get:
      operationId: listContinuityLedgerEvents
      summary: List continuity ledger events for the current tenant
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityLedgerEvent"

  /api/v1/continuity-ledger/suggestions:
    get:
      operationId: listContinuitySuggestions
      summary: List continuity relation suggestions
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuitySuggestion"
    post:
      operationId: recordContinuitySuggestion
      summary: Record a continuity relation suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordContinuitySuggestion"
      responses:
        "200":
          description: Recorded suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuitySuggestion"

  /api/v1/continuity-ledger/suggestions/{suggestionId}/accept:
    post:
      operationId: acceptContinuitySuggestion
      summary: Accept a continuity relation suggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuitySuggestion"

  /api/v1/continuity-ledger/suggestions/{suggestionId}/reject:
    post:
      operationId: rejectContinuitySuggestion
      summary: Reject a continuity relation suggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuitySuggestion"

  /api/v1/continuity-ledger/contradictions:
    get:
      operationId: listContinuityContradictions
      summary: List contradiction candidates
      responses:
        "200":
          description: Contradiction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityContradiction"
    post:
      operationId: proposeContinuityContradiction
      summary: Propose a contradiction candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeContinuityContradiction"
      responses:
        "200":
          description: Proposed contradiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityContradiction"

  /api/v1/continuity-ledger/contradictions/{contradictionId}/confirm:
    post:
      operationId: confirmContinuityContradiction
      summary: Confirm a contradiction candidate
      parameters:
        - name: contradictionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed contradiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityContradiction"

  /api/v1/continuity-ledger/contradictions/{contradictionId}/reject:
    post:
      operationId: rejectContinuityContradiction
      summary: Reject a contradiction candidate
      parameters:
        - name: contradictionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected contradiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityContradiction"

  /api/v1/continuity-ledger/commitments:
    post:
      operationId: recordContinuityCommitment
      summary: Record a commitment in the continuity ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordContinuityCommitment"
      responses:
        "200":
          description: Recorded commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCommitment"

  /api/v1/continuity-ledger/commitments/{commitmentId}/confirm:
    post:
      operationId: confirmContinuityCommitment
      summary: Confirm a pending commitment
      parameters:
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCommitment"

  /api/v1/continuity-ledger/commitments/{commitmentId}/reject:
    post:
      operationId: rejectContinuityCommitment
      summary: Reject a pending commitment
      parameters:
        - name: commitmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCommitment"

  /api/v1/continuity-ledger/overdue-commitments:
    get:
      operationId: listOverdueCommitments
      summary: List overdue commitments for the current tenant
      responses:
        "200":
          description: Overdue commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityCommitment"

  /api/v1/continuity-ledger/occurrences/{occurrenceId}/brief:
    get:
      operationId: getMeetingBrief
      summary: Generate previous-meeting brief for an occurrence
      parameters:
        - name: occurrenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meeting brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingBrief"

  /api/v1/continuity-ledger/occurrences/{occurrenceId}/continuity:
    get:
      operationId: getOccurrenceContinuity
      summary: Fetch continuity projection for an occurrence
      parameters:
        - name: occurrenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Continuity projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceContinuity"

  /api/v1/continuity-ledger/rebuild:
    post:
      operationId: rebuildContinuityLedgerProjections
      summary: Rebuild tenant ledger projections from the event stream
      responses:
        "200":
          description: Rebuild summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildProjectionsResult"

  /api/v1/decisions:
    get:
      operationId: listDecisions
      summary: Decision ledger
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ArtifactStatus"
      responses:
        "200":
          description: Decision page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionListResponse"

  /api/v1/actions:
    get:
      operationId: listActions
      summary: Action center
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ArtifactStatus"
      responses:
        "200":
          description: Action page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionListResponse"

  /api/v1/actions/{actionId}/complete:
    post:
      operationId: completeAction
      summary: Mark action complete (optimistic-safe)
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionItem"

  /api/v1/commitments:
    get:
      operationId: listCommitments
      summary: Commitment tracker
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Commitment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentListResponse"

  /api/v1/templates:
    get:
      operationId: listTemplates
      summary: Template studio list
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateSummary"

  /api/v1/teams/settings:
    get:
      operationId: getTeamsSettings
      summary: Teams integration settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsSettings"

  /api/v1/model-control/health:
    get:
      operationId: getModelHealth
      summary: Model control plane health (admin routing detail gated in UI)
      responses:
        "200":
          description: Model health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelHealthResponse"

  /api/v1/ai-jobs:
    get:
      operationId: listAiJobs
      summary: AI job timeline
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobListResponse"

  /api/v1/operations/overview:
    get:
      operationId: getOperationsOverview
      summary: Operations center snapshot
      responses:
        "200":
          description: Ops overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"

  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: Audit viewer
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"

components:
  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StatusFilter:
      name: status
      in: query
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, modules]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        service:
          type: string
        modules:
          type: array
          items:
            type: string

    PortalRole:
      type: string
      enum: [VIEWER, MEMBER, APPROVER, ADMIN, OPERATIONS]

    PortalUser:
      type: object
      additionalProperties: false
      required: [id, displayName, email, role, tenantId, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/PortalRole"
        tenantId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string

    DashboardResponse:
      type: object
      additionalProperties: false
      required: [pendingApprovals, openActions, overdueCommitments, runningJobs, recentMeetings]
      properties:
        pendingApprovals:
          type: integer
        openActions:
          type: integer
        overdueCommitments:
          type: integer
        runningJobs:
          type: integer
        recentMeetings:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"

    MeetingOccurrenceStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, ENDED, CANCELLED, PROCESSING, READY, FAILED]

    MeetingSummary:
      type: object
      additionalProperties: false
      required: [id, title, status, scheduledStartAt, participantCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/MeetingOccurrenceStatus"
        scheduledStartAt:
          type: string
          format: date-time
        participantCount:
          type: integer

    MeetingListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"
        nextCursor:
          type: string
          nullable: true

    ArtifactStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, COMPLETED, OPEN, AT RISK]

    EvidenceRef:
      type: object
      additionalProperties: false
      required: [segmentId, startMs, endMs, quote]
      properties:
        segmentId:
          type: string
          format: uuid
        startMs:
          type: integer
        endMs:
          type: integer
        quote:
          type: string

    MeetingNote:
      type: object
      additionalProperties: false
      required: [id, visibility, body, updatedAt, authorId]
      properties:
        id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [SHARED, PRIVATE]
        body:
          type: string
        updatedAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid

    UpdateNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string

    DecisionItem:
      type: object
      additionalProperties: false
      required: [id, meetingId, title, status, evidence, createdAt]
      properties:
        id:

# Adaptive chunk signal gate (helper dictionaries under aiprocessing/signal/dictionaries/)
# Shadow mode default: measure FN before hard-skip in production.
meeting:
  signal-gate:
    enabled: true
    mode: adaptive
    threshold: 4.5
    continuation-aware: true
    semantic-repetition-enabled: true
    hard-marker-shortcut-enabled: true
    # Hard skip on: filler chunks do not call EXTRACT LLM (Faz 3 targets met).
    shadow-mode: false
    classifier-enabled: true
    uncertain-band: 2.0
    policy-version: adaptive-gate-v3
  speech-signals:
    dictionary-version: tr-en-v1

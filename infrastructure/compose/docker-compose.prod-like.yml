# Actenora prod-like compose stack (Wave 7).
# Usage:
#   cp infrastructure/compose/.env.prod-fixture.example infrastructure/compose/.env.prod-fixture
#   docker compose -f infrastructure/compose/docker-compose.prod-like.yml --env-file infrastructure/compose/.env.prod-fixture up -d --build
#   ./scripts/acceptance-compose.sh
#
# Profiles:
#   default — data plane + platform-backend (prod,prod-fixture,it)
#   portal  — adds web-portal static UI
#   ai      — adds ai-orchestrator

name: actenora-prod-like

x-prod-fixture-profiles: &prod-fixture-profiles
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,prod-fixture,it}

services:
  postgres:
    # pgvector-enabled Postgres 16 (required for meeting_knowledge_item embeddings)
    image: pgvector/pgvector:pg16
    container_name: actenora-prodlike-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actenora} -d ${POSTGRES_DB:-actenora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: actenora-prodlike-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - data-network
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmqctl authenticate_user \"$${RABBITMQ_DEFAULT_USER:-actenora}\" \"$${RABBITMQ_DEFAULT_PASS}\" >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  rabbitmq-init:
    image: curlimages/curl:8.12.1
    container_name: actenora-prodlike-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      DEFINITIONS_FILE: /definitions.json
    volumes:
      - ../rabbitmq/definitions.json:/definitions.json:ro
      - ../rabbitmq/import-definitions.sh:/import-definitions.sh:ro
    entrypoint: ["/bin/sh", "/import-definitions.sh"]
    networks:
      - data-network
      - app-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: actenora-prodlike-redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec redis-server /usr/local/etc/redis/redis.conf --appendonly yes --save "60 1"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: actenora-prodlike-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY required}
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - data-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: actenora-prodlike-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-actenora}
      OBJECT_STORAGE_TENANT_PREFIX_ROOT: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:-tenants}
      OBJECT_STORAGE_TEST_TENANT_ID: ${OBJECT_STORAGE_TEST_TENANT_ID:-tenant-fixture-test}
    volumes:
      - ../minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - data-network
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: actenora-prodlike-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  platform-backend:
    build:
      context: ../..
      dockerfile: apps/platform-backend/Dockerfile
    container_name: actenora-prodlike-platform-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      <<: *prod-fixture-profiles
      ACTENORA_ENV: ${ACTENORA_ENV:-prod-fixture}
      PLATFORM_BACKEND_PORT: "8080"
      ACTENORA_PERSISTENCE_MODE: jdbc
      ACTENORA_MESSAGING_MODE: jdbc-rabbit
      # Fixture CI uses headers auth (real operator identity). Staging/prod override:
      # ACTENORA_AUTH_MODE=entra ACTENORA_PORTAL_AUTH_MODE=msal (+ Entra issuer/audience)
      ACTENORA_AUTH_MODE: ${ACTENORA_AUTH_MODE:-headers}
      ACTENORA_PORTAL_AUTH_MODE: ${ACTENORA_PORTAL_AUTH_MODE:-headers}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-actenora}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-actenora}
      OBJECT_STORAGE_TENANT_PREFIX_ROOT: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:-tenants}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS_ENABLE: "false"
      ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE:?required}
      ACTENORA_DELIVERY_WEBHOOK_SECRET: ${ACTENORA_DELIVERY_WEBHOOK_SECRET:?required}
      ACTENORA_PORTAL_LINK_SECRET: ${ACTENORA_PORTAL_LINK_SECRET:?required}
      ACTENORA_CORS_ALLOWED_ORIGINS: ${ACTENORA_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      ACTENORA_ALLOW_DEFAULT_SECRETS: "false"
      # NanobaseAI Intelligence — OpenAI-compatible endpoint (not ai-orchestrator).
      ACTENORA_AI_PROVIDER_KIND: ${ACTENORA_AI_PROVIDER_KIND:-offline}
      ACTENORA_AI_PROVIDER_BASE_URL: ${ACTENORA_AI_PROVIDER_BASE_URL:-http://host.docker.internal:8010}
      ACTENORA_AI_PROVIDER_READ_TIMEOUT: ${ACTENORA_AI_PROVIDER_READ_TIMEOUT:-1800s}
      ACTENORA_AI_PROVIDER_MAX_ATTEMPTS: ${ACTENORA_AI_PROVIDER_MAX_ATTEMPTS:-5}
      ACTENORA_AI_PROVIDER_SERVED_MODEL_IDS: ${ACTENORA_AI_PROVIDER_SERVED_MODEL_IDS:-nanobaseai-primary,nanobaseai-local}
      ACTENORA_AI_PROVIDER_FAST_EXTRACTION_SERVED_MODEL_ID: ${ACTENORA_AI_PROVIDER_FAST_EXTRACTION_SERVED_MODEL_ID:-nanobase-qwen36-35b-a3b-mtp}
      ACTENORA_AI_PROVIDER_FINAL_SERVED_MODEL_ID: ${ACTENORA_AI_PROVIDER_FINAL_SERVED_MODEL_ID:-nanobase-qwen36-35b-a3b-mtp}
      ACTENORA_AI_PIPELINE_MODE: ${ACTENORA_AI_PIPELINE_MODE:-staged}
      ACTENORA_AI_WORKER_ENABLED: ${ACTENORA_AI_WORKER_ENABLED:-true}
    ports:
      - "${PLATFORM_BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network
      - data-network
      - ai-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s
    restart: unless-stopped

  ai-orchestrator:
    profiles: ["ai"]
    build:
      context: ../..
      dockerfile: apps/ai-orchestrator/Dockerfile
    container_name: actenora-prodlike-ai-orchestrator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_ORCHESTRATOR_HOST: 0.0.0.0
      AI_ORCHESTRATOR_PORT: "8000"
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ACTENORA_AI_EGRESS_DENY_PUBLIC: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${AI_ORCHESTRATOR_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-network
      - data-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/actuator/health/liveness | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web-portal:
    profiles: ["portal"]
    build:
      context: ../..
      dockerfile: apps/web-portal/Dockerfile
      args:
        VITE_API_MODE: http
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_PORTAL_AUTH_MODE: ${VITE_PORTAL_AUTH_MODE:-headers}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
        VITE_IDENTITY_ENTRA_OID: ${VITE_IDENTITY_ENTRA_OID:-}
        VITE_IDENTITY_ENTRA_TID: ${VITE_IDENTITY_ENTRA_TID:-}
        VITE_IDENTITY_EMAIL: ${VITE_IDENTITY_EMAIL:-}
        VITE_IDENTITY_DISPLAY_NAME: ${VITE_IDENTITY_DISPLAY_NAME:-}
        VITE_IDENTITY_GLOBAL_ADMIN: ${VITE_IDENTITY_GLOBAL_ADMIN:-false}
    container_name: actenora-prodlike-web-portal
    depends_on:
      platform-backend:
        condition: service_healthy
    ports:
      - "${WEB_PORTAL_PORT:-3000}:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ | grep -q html"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: actenora-prodlike-postgres-data
  rabbitmq-data:
    name: actenora-prodlike-rabbitmq-data
  redis-data:
    name: actenora-prodlike-redis-data
  minio-data:
    name: actenora-prodlike-minio-data

networks:
  app-network:
    name: actenora-prodlike-app-network
    driver: bridge
  data-network:
    name: actenora-prodlike-data-network
    driver: bridge
  ai-network:
    name: actenora-prodlike-ai-network
    driver: bridge

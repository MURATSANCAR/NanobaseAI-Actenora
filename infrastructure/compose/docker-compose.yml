# Actenora local infrastructure baseline (FAZ 2)
# Usage: docker compose -f infrastructure/compose/docker-compose.yml --env-file .env up -d
#
# Networks:
#   app-network  — application services, MailHog, OTel
#   data-network — PostgreSQL, Redis, RabbitMQ, MinIO
#   ai-network   — AI orchestrator (+ future local LLM / Qwen)

name: actenora

x-local-credentials-warning: &local-only
  ACTENORA_ENV: ${ACTENORA_ENV:-local}

services:
  postgres:
    # pgvector-enabled Postgres 16 (required for meeting_knowledge_item embeddings)
    image: pgvector/pgvector:pg16
    container_name: actenora-postgres
    environment:
      <<: *local-only
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actenora_local_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actenora} -d ${POSTGRES_DB:-actenora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: actenora-rabbitmq
    hostname: rabbitmq
    environment:
      <<: *local-only
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-actenora_local_change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - data-network
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmqctl authenticate_user \"$${RABBITMQ_DEFAULT_USER:-actenora}\" \"$${RABBITMQ_DEFAULT_PASS}\" >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  rabbitmq-init:
    image: curlimages/curl:8.12.1
    container_name: actenora-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *local-only
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-actenora_local_change_me}
      DEFINITIONS_FILE: /definitions.json
    volumes:
      - ../rabbitmq/definitions.json:/definitions.json:ro
      - ../rabbitmq/import-definitions.sh:/import-definitions.sh:ro
    entrypoint: ["/bin/sh", "/import-definitions.sh"]
    networks:
      - data-network
      - app-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: actenora-redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${REDIS_PERSISTENCE:-false}" = "true" ]; then
          exec redis-server /usr/local/etc/redis/redis.conf --appendonly yes --save "60 1"
        else
          exec redis-server /usr/local/etc/redis/redis.conf --appendonly no --save ""
        fi
    environment:
      REDIS_PERSISTENCE: ${REDIS_PERSISTENCE:-false}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: actenora-minio
    command: server /data --console-address ":9001"
    environment:
      <<: *local-only
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-actenora_minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-actenora_minio_change_me}
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - data-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: actenora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-actenora_minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-actenora_minio_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-actenora}
      OBJECT_STORAGE_TENANT_PREFIX_ROOT: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:-tenants}
      OBJECT_STORAGE_TEST_TENANT_ID: ${OBJECT_STORAGE_TEST_TENANT_ID:-tenant-local-test}
    volumes:
      - ../minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - data-network
    restart: "no"

  mailhog:
    # Scratch-based image: no shell/curl for probes. Seed job retries SMTP until ready.
    image: mailhog/mailhog:v1.0.1
    container_name: actenora-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  mailhog-seed:
    image: python:3.12-alpine
    container_name: actenora-mailhog-seed
    depends_on:
      mailhog:
        condition: service_started
    environment:
      MAILHOG_SMTP_HOST: mailhog
      MAILHOG_SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-actenora-local@example.test}
      MAIL_TO: ${MAIL_TO:-developer@example.test}
    volumes:
      - ../mailhog/send-test-mail.py:/send-test-mail.py:ro
    command: ["python", "/send-test-mail.py"]
    networks:
      - app-network
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: actenora-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    networks:
      - app-network
      - ai-network
    # Distroless image: probe via companion. Mark healthy after process start_period.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  platform-backend:
    build:
      context: ../..
      dockerfile: apps/platform-backend/Dockerfile
    container_name: actenora-platform-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      <<: *local-only
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      PLATFORM_BACKEND_PORT: "8080"
      ACTENORA_TRANSCRIPT_MODE: ${ACTENORA_TRANSCRIPT_MODE:-embedded}
      TRANSCRIPT_WORKER_BASE_URL: ${TRANSCRIPT_WORKER_BASE_URL:-http://transcript-worker:8081}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actenora_local_change_me}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-actenora}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-actenora_local_change_me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-actenora_minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-actenora_minio_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-actenora}
      OBJECT_STORAGE_TENANT_PREFIX_ROOT: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:-tenants}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: platform-backend
    ports:
      - "${PLATFORM_BACKEND_PORT:-8080}:8080"
    # FAZ 27 — non-root image + read-only root FS with writable tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network
      - data-network
      - ai-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  transcript-worker:
    build:
      context: ../..
      dockerfile: services/transcript-worker/Dockerfile
    container_name: actenora-transcript-worker
    profiles: ["extraction"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *local-only
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      TRANSCRIPT_WORKER_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actenora_local_change_me}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-actenora}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-actenora_minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-actenora_minio_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-actenora}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: transcript-worker
    ports:
      - "${TRANSCRIPT_WORKER_PORT:-8081}:8081"
    networks:
      - app-network
      - data-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8081/actuator/health/liveness | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # CPU llama.cpp servers (optional — profile `llm`). Host paths for GGUF via env.
  llm-fast:
    profiles: ["llm"]
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: actenora-llm-fast
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "2"
      - -c
      - "8192"
      - -ngl
      - "0"
      - -m
      - ${LLM_FAST_MODEL_PATH:-/models/fast.gguf}
    volumes:
      - ${LLM_MODELS_HOST_PATH:-./models}:/models:ro
    networks:
      - ai-network
    restart: unless-stopped

  llm-final:
    profiles: ["llm"]
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: actenora-llm-final
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "1"
      - -c
      - "32768"
      - -ngl
      - "0"
      - -m
      - ${LLM_FINAL_MODEL_PATH:-/models/final.gguf}
    volumes:
      - ${LLM_MODELS_HOST_PATH:-./models}:/models:ro
    networks:
      - ai-network
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ../..
      dockerfile: apps/ai-orchestrator/Dockerfile
    container_name: actenora-ai-orchestrator
    depends_on:
      otel-collector:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *local-only
      AI_ORCHESTRATOR_HOST: 0.0.0.0
      AI_ORCHESTRATOR_PORT: "8000"
      # Qwen / local LLM — intentionally unset by default so readiness=DEGRADED
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ACTENORA_AI_FAST_BASE_URL: ${ACTENORA_AI_FAST_BASE_URL:-}
      ACTENORA_AI_FINAL_BASE_URL: ${ACTENORA_AI_FINAL_BASE_URL:-}
      ACTENORA_AI_PIPELINE_MODE: ${ACTENORA_AI_PIPELINE_MODE:staged}
      ACTENORA_AI_PROVIDER_MAX_CONCURRENCY_FINAL: "1"
      ACTENORA_AI_EGRESS_DENY_PUBLIC: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ai-orchestrator
    ports:
      - "${AI_ORCHESTRATOR_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-network
      - app-network
      - data-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/actuator/health/liveness | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
    name: actenora-postgres-data
  rabbitmq-data:
    name: actenora-rabbitmq-data
  redis-data:
    name: actenora-redis-data
  minio-data:
    name: actenora-minio-data

networks:
  app-network:
    name: actenora-app-network
    driver: bridge
  data-network:
    name: actenora-data-network
    driver: bridge
  ai-network:
    name: actenora-ai-network
    driver: bridge

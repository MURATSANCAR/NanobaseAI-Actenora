services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actenora}
      POSTGRES_USER: ${POSTGRES_USER:-actenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actenora_local_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - actenora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actenora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-actenora_local_change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-actenora_minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-actenora_minio_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - actenora_minio:/data

volumes:
  actenora_pg:
  actenora_minio:

# portal.nanobase.ai server overlay — no host port clashes with QA stack.
# Usage (on server):
#   docker compose \
#     -f docker-compose.prod-like.yml \
#     -f docker-compose.portal-server.override.yml \
#     --env-file /etc/nanobaseai/actenora.env \
#     up -d --build

name: actenora-portal-server

services:
  postgres:
    ports: !override []

  rabbitmq:
    ports: !override []

  redis:
    ports: !override []

  minio:
    ports: !override []

  mailhog:
    ports: !override []

  platform-backend:
    image: actenora-platform-backend:graph-fix
    build:
      context: .
      dockerfile: Dockerfile.runtime
    ports:
      - "127.0.0.1:${ACTENORA_PLATFORM_BACKEND_HOST_PORT:-8088}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
      - data-network
      - ai-network
      - nanobase-ai-gateway
    environment:
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: ${SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES:-true}
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: ${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:-true}
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-true}
      ACTENORA_AUTH_MODE: ${ACTENORA_AUTH_MODE:-headers}
      ACTENORA_PORTAL_AUTH_MODE: ${ACTENORA_PORTAL_AUTH_MODE:-headers}
      ACTENORA_ENTRA_ISSUER_URI: ${ACTENORA_ENTRA_ISSUER_URI:?ACTENORA_ENTRA_ISSUER_URI required}
      ACTENORA_ENTRA_AUDIENCE: ${ACTENORA_ENTRA_AUDIENCE:?ACTENORA_ENTRA_AUDIENCE required}
      ACTENORA_CORS_ALLOWED_ORIGINS: ${ACTENORA_CORS_ALLOWED_ORIGINS:-https://portal.nanobase.ai}
      ACTENORA_AI_PROVIDER_KIND: ${ACTENORA_AI_PROVIDER_KIND:-nanobaseai}
      # OpenAI-compatible llama-server (chat/completions). Contract gateway :8082 is /v1/generate only.
      ACTENORA_AI_PROVIDER_BASE_URL: ${ACTENORA_AI_PROVIDER_BASE_URL:-http://host.docker.internal:8010}
      ACTENORA_AI_PROVIDER_READ_TIMEOUT: ${ACTENORA_AI_PROVIDER_READ_TIMEOUT:-7200s}
      ACTENORA_AI_PROVIDER_MAX_ATTEMPTS: ${ACTENORA_AI_PROVIDER_MAX_ATTEMPTS:-5}
      # Must match llama-server --alias on :8010 (see scripts/server/restore-meeting-35b-llm.sh).
      ACTENORA_AI_PROVIDER_FAST_EXTRACTION_SERVED_MODEL_ID: ${ACTENORA_AI_PROVIDER_FAST_EXTRACTION_SERVED_MODEL_ID:-nanobase-qwen36-35b-a3b-mtp}
      ACTENORA_AI_PROVIDER_FINAL_SERVED_MODEL_ID: ${ACTENORA_AI_PROVIDER_FINAL_SERVED_MODEL_ID:-nanobase-qwen36-35b-a3b-mtp}
      ACTENORA_AI_EVAL_EXPORT_ENABLED: ${ACTENORA_AI_EVAL_EXPORT_ENABLED:-false}
      ACTENORA_AI_EVAL_EXPORT_ROOT: /app/var/eval-artifacts
      # legacy = monolithic ExtractionPipelineService (proven quality on 35B);
      # staged = DAG (NORMALIZE→TRIAGE→EXTRACT…) — EXTRACT JSON still flaky on CPU.
      ACTENORA_AI_PIPELINE_MODE: ${ACTENORA_AI_PIPELINE_MODE:-legacy}
      ACTENORA_AI_FINALIZATION_MODE: ${ACTENORA_AI_FINALIZATION_MODE:-editorial}
      ACTENORA_AI_FINALIZATION_PROMPT_RESOURCE: ${ACTENORA_AI_FINALIZATION_PROMPT_RESOURCE:-/aiprocessing/prompts/editorial-summary.v1.txt}
      ACTENORA_AI_FINALIZATION_PROMPT_VERSION: ${ACTENORA_AI_FINALIZATION_PROMPT_VERSION:-pv-meeting-editorial-summary-v1}
      ACTENORA_AI_FINALIZATION_SCHEMA: ${ACTENORA_AI_FINALIZATION_SCHEMA:-meeting.editorial-summary.v1}
      ACTENORA_AI_FINALIZATION_TASK_TYPE: ${ACTENORA_AI_FINALIZATION_TASK_TYPE:-FINAL_NOTE}
      ACTENORA_AI_FINALIZATION_MAX_OUTPUT_TOKENS: ${ACTENORA_AI_FINALIZATION_MAX_OUTPUT_TOKENS:-768}
      ACTENORA_AI_FINALIZATION_TIMEOUT_SECONDS: ${ACTENORA_AI_FINALIZATION_TIMEOUT_SECONDS:-1800}
      ACTENORA_AI_FINALIZATION_FAILURE_MODE: ${ACTENORA_AI_FINALIZATION_FAILURE_MODE:-deterministic}
      ACTENORA_AI_WORKER_ENABLED: ${ACTENORA_AI_WORKER_ENABLED:-true}
      ACTENORA_AI_WORKER_STALE_RUNNING_AFTER: ${ACTENORA_AI_WORKER_STALE_RUNNING_AFTER:-PT24H}
      ACTENORA_AI_WORKER_RECLAIM_ORPHANS_ON_STARTUP: ${ACTENORA_AI_WORKER_RECLAIM_ORPHANS_ON_STARTUP:-true}
      ACTENORA_PERSISTENCE_MODE: ${ACTENORA_PERSISTENCE_MODE:-jdbc}
      # Prefer durable JDBC outbox + RabbitMQ on portal server; inmemory still syncs webhooks inline.
      ACTENORA_MESSAGING_MODE: ${ACTENORA_MESSAGING_MODE:-jdbc-rabbit}
      ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_INTERVAL: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_INTERVAL:-PT15M}
      ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_ON_STARTUP: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_ON_STARTUP:-true}
      ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RECOVER_EMPTY_DELTA: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RECOVER_EMPTY_DELTA:-true}
      ACTENORA_MICROSOFT_GRAPH_ENABLED: ${ACTENORA_MICROSOFT_GRAPH_ENABLED:-false}
      ACTENORA_MICROSOFT_GRAPH_AUTH_MODE: ${ACTENORA_MICROSOFT_GRAPH_AUTH_MODE:-CLIENT_SECRET}
      ACTENORA_MICROSOFT_GRAPH_TENANT_ID: ${ACTENORA_MICROSOFT_GRAPH_TENANT_ID:-}
      ACTENORA_MICROSOFT_GRAPH_CLIENT_ID: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_ID:-}
      ACTENORA_MICROSOFT_GRAPH_CLIENT_SECRET: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_SECRET:-}
      ACTENORA_MICROSOFT_GRAPH_DEFAULT_MAILBOX_USER_ID: ${ACTENORA_MICROSOFT_GRAPH_DEFAULT_MAILBOX_USER_ID:-}
      ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_ATTRIBUTION_RECHECK_WINDOW: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_ATTRIBUTION_RECHECK_WINDOW:-P30D}
      ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE:?ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE required}
      # Graph Mail.Send (no Authenticated SMTP). Sender mailbox UPN / OID.
      ACTENORA_DELIVERY_MAIL_PROVIDER: ${ACTENORA_DELIVERY_MAIL_PROVIDER:-microsoft-graph}
      ACTENORA_DELIVERY_GRAPH_SENDER: ${ACTENORA_DELIVERY_GRAPH_SENDER:-muratsancar@nanobase.ai}
      ACTENORA_DELIVERY_MAIL_FROM: ${ACTENORA_DELIVERY_MAIL_FROM:-muratsancar@nanobase.ai}
      ACTENORA_DELIVERY_MAIL_FROM_DISPLAY_NAME: ${ACTENORA_DELIVERY_MAIL_FROM_DISPLAY_NAME:-NanobaseAI EasyMeeting}
      ACTENORA_DRAFT_MINUTES_READY_ADDITIONAL_RECIPIENTS: ${ACTENORA_DRAFT_MINUTES_READY_ADDITIONAL_RECIPIENTS:-muratsancar@nanobase.ai}
      # Keep MailHog for Spring mail health only; delivery uses Graph.
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}

networks:
  nanobase-ai-gateway:
    external: true
    name: docker-compose_default

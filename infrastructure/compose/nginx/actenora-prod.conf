# Actenora single-file compose deployment — nginx reverse proxy (host-level).
#
# Fronts the containers started by docker-compose.prod.yml:
#   * platform-backend  -> 127.0.0.1:8088  (BFF + webhooks; loopback only)
#   * web-portal        -> 127.0.0.1:3000  (SPA container; loopback only)
#
# Install (server):
#   sudo cp infrastructure/compose/nginx/actenora-prod.conf /etc/nginx/sites-available/actenora
#   sudo ln -sf /etc/nginx/sites-available/actenora /etc/nginx/sites-enabled/actenora
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is assumed via certbot/Let's Encrypt (paths below are the certbot defaults).

upstream actenora_platform_backend {
    server 127.0.0.1:8088;
    keepalive 8;
}

upstream actenora_web_portal {
    server 127.0.0.1:3000;
    keepalive 8;
}

# ---- HTTP -> HTTPS redirect (keep ACME challenge reachable) ------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.nanobase.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.nanobase.ai;

    ssl_certificate     /etc/letsencrypt/live/portal.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.nanobase.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # VTT transcript upload is capped at ~25 MB by the backend — allow headroom.
    client_max_body_size 32m;

    # Security headers (portal is a same-origin SPA + BFF).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- API + webhooks -> platform-backend --------------------------------
    # Covers /api/v1/portal, /api/v1/microsoft/webhooks, /api/v1/delivery/webhooks,
    # /api/v1/approvals, /api/v1/meeting-notes, /api/v1/audit, etc.
    location /api/ {
        proxy_pass http://actenora_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;   # long: transcript upload + AI-triggered paths
        proxy_read_timeout 600s;
    }

    # Backend health (optional; handy for external uptime checks).
    location = /actuator/health {
        proxy_pass http://actenora_platform_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- SPA -> web-portal container ---------------------------------------
    location / {
        proxy_pass http://actenora_web_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

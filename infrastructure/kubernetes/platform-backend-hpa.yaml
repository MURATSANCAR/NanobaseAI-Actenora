apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-backend
  labels:
    app.kubernetes.io/name: platform-backend
    app.kubernetes.io/part-of: actenora
    actenora.io/wave: "8"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

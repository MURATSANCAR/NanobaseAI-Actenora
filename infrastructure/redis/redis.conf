# Actenora local Redis (FAZ 2)
# Persistence is optional for local development. Compose toggles via REDIS_PERSISTENCE.
# When REDIS_PERSISTENCE=false (default), compose overrides with --save "" --appendonly no.

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Defaults favor ephemeral local cache. Enable AOF/RDB only when persistence is requested.
save ""
appendonly no
appendfsync everysec

maxmemory 256mb
maxmemory-policy allkeys-lru

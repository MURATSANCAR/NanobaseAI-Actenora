## Actenora RabbitMQ (FAZ 2)
## Credentials come from RABBITMQ_DEFAULT_* env vars — not hardcoded here.
## Topology is imported by docker-entrypoint-actenora.sh AFTER the default user
## is created. Do not set management.load_definitions here: it skips DEFAULT_* seeding
## and our definitions.json intentionally has no users (env-driven credentials).

loopback_users.guest = false
heartbeat = 30
consumer_timeout = 1800000

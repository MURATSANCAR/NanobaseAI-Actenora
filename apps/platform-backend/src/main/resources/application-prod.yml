spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${POSTGRES_JDBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ACTENORA_ENTRA_ISSUER_URI}
          audiences: ${ACTENORA_ENTRA_AUDIENCE}

actenora:
  persistence:
    mode: jdbc
  tenancy:
    require-security-context: true
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    enabled: ${ACTENORA_OBJECT_STORAGE_ENABLED:true}
  allow-default-secrets: false
  env: ${ACTENORA_ENV:production}
  delivery:
    mail:
      provider: microsoft-graph
    portal-link:
      secret: ${ACTENORA_PORTAL_LINK_SECRET}
    webhook:
      secret: ${ACTENORA_DELIVERY_WEBHOOK_SECRET}
  portal:
    auth:
      mode: ${ACTENORA_PORTAL_AUTH_MODE:msal}
  ai:
    provider:
      # Required non-mock on prod (LocalProviderFactory refuses mock)
      kind: ${ACTENORA_AI_PROVIDER_KIND}
      base-url: ${ACTENORA_AI_PROVIDER_BASE_URL}
    worker:
      enabled: ${ACTENORA_AI_WORKER_ENABLED:true}
      poll-interval: ${ACTENORA_AI_WORKER_POLL_INTERVAL:PT15S}
  microsoft-graph:
    enabled: ${ACTENORA_MICROSOFT_GRAPH_ENABLED:true}
    auth-mode: ${ACTENORA_MICROSOFT_GRAPH_AUTH_MODE:${MICROSOFT_GRAPH_AUTH_MODE:CERTIFICATE}}
    tenant-id: ${ACTENORA_MICROSOFT_GRAPH_TENANT_ID:${MICROSOFT_TENANT_ID:}}
    client-id: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_ID:${MICROSOFT_CLIENT_ID:}}
    client-secret: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_SECRET:${MICROSOFT_CLIENT_SECRET:}}
    certificate-pem-path: ${ACTENORA_MICROSOFT_GRAPH_CERTIFICATE_PEM_PATH:${MICROSOFT_CERTIFICATE_PEM_PATH:}}
    private-key-pem-path: ${ACTENORA_MICROSOFT_GRAPH_PRIVATE_KEY_PEM_PATH:${MICROSOFT_PRIVATE_KEY_PEM_PATH:}}
    graph-base-url: ${MICROSOFT_GRAPH_BASE_URL:https://graph.microsoft.com}
    authority-host: ${MICROSOFT_AUTHORITY_HOST:https://login.microsoftonline.com}
    workers-enabled: ${ACTENORA_MICROSOFT_GRAPH_WORKERS_ENABLED:true}
    default-mailbox-user-id: ${ACTENORA_MICROSOFT_GRAPH_DEFAULT_MAILBOX_USER_ID:}
    transcript-poll-interval: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_INTERVAL:PT5M}
    subscription-renew-before: ${ACTENORA_MICROSOFT_GRAPH_SUBSCRIPTION_RENEW_BEFORE:PT6H}
    subscription-renew-window: ${ACTENORA_MICROSOFT_GRAPH_SUBSCRIPTION_RENEW_WINDOW:PT48H}
    webhook:
      client-state: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE}
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:entra}
    cors:
      allowed-origins: ${ACTENORA_CORS_ALLOWED_ORIGINS}
    rate-limit:
      enabled: true
      max-requests: ${ACTENORA_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: 60
    signed-url:
      max-ttl-seconds: 300
      default-ttl-seconds: 120
    retention:
      audit-retention-days: ${ACTENORA_AUDIT_RETENTION_DAYS:2555}

management:
  endpoint:
    health:
      show-details: never

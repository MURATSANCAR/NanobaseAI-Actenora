# Production profile — no default secrets. Refuses local credential markers.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${POSTGRES_JDBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ACTENORA_ENTRA_ISSUER_URI}
          audiences: ${ACTENORA_ENTRA_AUDIENCE}

actenora:
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    enabled: ${ACTENORA_OBJECT_STORAGE_ENABLED:true}
  allow-default-secrets: false
  env: ${ACTENORA_ENV:production}
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:entra}
    cors:
      allowed-origins: ${ACTENORA_CORS_ALLOWED_ORIGINS}
    rate-limit:
      enabled: true
      max-requests: ${ACTENORA_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: 60
    signed-url:
      max-ttl-seconds: 300
      default-ttl-seconds: 120
    retention:
      audit-retention-days: ${ACTENORA_AUDIT_RETENTION_DAYS:2555}

management:
  endpoint:
    health:
      show-details: never

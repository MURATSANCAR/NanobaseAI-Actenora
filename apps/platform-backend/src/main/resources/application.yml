server:
  port: ${PLATFORM_BACKEND_PORT:8080}

spring:
  application:
    name: platform-backend
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${POSTGRES_JDBC_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${ACTENORA_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${ACTENORA_UPLOAD_MAX_REQUEST_SIZE:26MB}
  flyway:
    enabled: true
    # Correct Spring property (was misspelled baselines-on-migrate — silent no-op).
    # Needed when public already has extensions from postgres init scripts.
    baseline-on-migrate: true
    baseline-version: 0
    # Schema-per-context layout; history lives in public so extension objects do not
    # collide with module schemas. create-schemas lets Flyway prepare empty schemas.
    create-schemas: true
    schemas: public,identity,tenant,policy,microsoftconnection,meeting,transcript,modelmanagement,aiprocessing,meetingintelligence,approval,template,delivery,audit,operations
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,rabbit,redis
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true

actenora:
  persistence:
    mode: ${ACTENORA_PERSISTENCE_MODE:inmemory}
  tenancy:
    require-security-context: ${ACTENORA_TENANCY_REQUIRE_SECURITY_CONTEXT:false}
  object-storage:
    enabled: ${ACTENORA_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    bucket: ${OBJECT_STORAGE_BUCKET:actenora}
    tenant-prefix-root: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:tenants}
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:mock}
    cors:
      allowed-origins: ${ACTENORA_CORS_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${ACTENORA_RATE_LIMIT_ENABLED:true}
      max-requests: ${ACTENORA_RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${ACTENORA_RATE_LIMIT_WINDOW_SECONDS:60}
    signed-url:
      max-ttl-seconds: ${ACTENORA_SIGNED_URL_MAX_TTL_SECONDS:900}
      default-ttl-seconds: ${ACTENORA_SIGNED_URL_DEFAULT_TTL_SECONDS:300}
    retention:
      audit-retention-days: ${ACTENORA_AUDIT_RETENTION_DAYS:2555}
  ai:
    provider:
      # mock | openai | vllm | llamacpp — local endpoints only (ADR-005), mock is rejected on prod
      kind: ${ACTENORA_AI_PROVIDER_KIND:mock}
      base-url: ${ACTENORA_AI_PROVIDER_BASE_URL:http://127.0.0.1:8000}
      connect-timeout: ${ACTENORA_AI_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${ACTENORA_AI_PROVIDER_READ_TIMEOUT:600s}
      max-concurrency: ${ACTENORA_AI_PROVIDER_MAX_CONCURRENCY:4}
      streaming-enabled: ${ACTENORA_AI_PROVIDER_STREAMING_ENABLED:true}
      served-model-ids: ${ACTENORA_AI_PROVIDER_SERVED_MODEL_IDS:qwen2.5-32b-instruct,qwen-local}
      max-attempts: ${ACTENORA_AI_PROVIDER_MAX_ATTEMPTS:3}
    routing:
      # false = FAZ 12 capability route stays authoritative, no routing/provenance audit
      enabled: ${ACTENORA_AI_ROUTING_ENABLED:true}
      # champion/challenger shadow; never replaces the production result, consensus stays OFF
      shadow-execution-enabled: ${ACTENORA_AI_ROUTING_SHADOW_ENABLED:false}
  delivery:
    webhook:
      # Shared secret for provider delivery confirmation callbacks (FAZ 30)
      secret: ${ACTENORA_DELIVERY_WEBHOOK_SECRET:local-delivery-webhook-secret}
    portal-link:
      secret: ${ACTENORA_PORTAL_LINK_SECRET:actenora-local-portal-secret}
      base-url: ${ACTENORA_PORTAL_LINK_BASE_URL:https://portal.nanobase.ai/actenora}
    mail:
      # mailhog (local) | microsoft-graph (prod CERTIFICATE path)
      provider: ${ACTENORA_DELIVERY_MAIL_PROVIDER:mailhog}
      from: ${ACTENORA_DELIVERY_MAIL_FROM:noreply@actenora.local}
      graph-sender: ${ACTENORA_DELIVERY_GRAPH_SENDER:}
  portal:
    auth:
      # mock = X-Mock-* headers (local); msal = Entra Bearer via SPA (prod)
      mode: ${ACTENORA_PORTAL_AUTH_MODE:mock}
    local-seed:
      # Only enable on local profile (see application-local.yml)
      enabled: ${ACTENORA_PORTAL_LOCAL_SEED:false}
      entra-tid: ${ACTENORA_PORTAL_LOCAL_SEED_ENTRA_TID:local-dev-tid}
      tenant-name: ${ACTENORA_PORTAL_LOCAL_SEED_TENANT_NAME:Actenora Local}
  microsoft-graph:
    # Bounded context + its Graph notification webhook are disabled locally by default (FAZ 32)
    enabled: ${ACTENORA_MICROSOFT_GRAPH_ENABLED:false}
    webhook:
      # clientState echoed by Graph in every change/lifecycle notification (FAZ 32)
      client-state: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE:local-graph-client-state}
  transcript:
    # embedded = in-process module (default); remote = HTTP proxy to transcript-worker (FAZ 26)
    mode: ${ACTENORA_TRANSCRIPT_MODE:embedded}
    remote:
      base-url: ${TRANSCRIPT_WORKER_BASE_URL:http://localhost:8081}
      connect-timeout: ${TRANSCRIPT_REMOTE_CONNECT_TIMEOUT:2s}
      read-timeout: ${TRANSCRIPT_REMOTE_READ_TIMEOUT:30s}
      max-retries: ${TRANSCRIPT_REMOTE_MAX_RETRIES:3}
      retry-backoff: ${TRANSCRIPT_REMOTE_RETRY_BACKOFF:200ms}
  messaging:
    # inmemory (default) | jdbc-rabbit (Wave 1 durable outbox relay)
    mode: ${ACTENORA_MESSAGING_MODE:inmemory}
    jdbc:
      schema: ${ACTENORA_MESSAGING_JDBC_SCHEMA:operations}
    relay:
      max-queue-depth: ${ACTENORA_MESSAGING_RELAY_MAX_QUEUE_DEPTH:10000}
  env: ${ACTENORA_ENV:local}
  allow-default-secrets: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}

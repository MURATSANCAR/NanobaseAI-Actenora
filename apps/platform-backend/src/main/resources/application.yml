server:
  port: ${PLATFORM_BACKEND_PORT:8080}

spring:
  application:
    name: platform-backend
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${POSTGRES_JDBC_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  servlet:
    multipart:
      max-file-size: ${ACTENORA_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${ACTENORA_UPLOAD_MAX_REQUEST_SIZE:26MB}
  flyway:
    enabled: true
    # Correct Spring property (was misspelled baselines-on-migrate — silent no-op).
    # Needed when public already has extensions from postgres init scripts.
    baseline-on-migrate: true
    baseline-version: 0
    # Schema-per-context layout; history lives in public so extension objects do not
    # collide with module schemas. create-schemas lets Flyway prepare empty schemas.
    create-schemas: true
    schemas: public,identity,tenant,policy,microsoftconnection,meeting,transcript,modelmanagement,aiprocessing,meetingintelligence,approval,template,delivery,audit,operations,notification
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,rabbit,redis
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true

actenora:
  persistence:
    mode: ${ACTENORA_PERSISTENCE_MODE:inmemory}
  tenancy:
    require-security-context: ${ACTENORA_TENANCY_REQUIRE_SECURITY_CONTEXT:false}
  object-storage:
    enabled: ${ACTENORA_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    bucket: ${OBJECT_STORAGE_BUCKET:actenora}
    tenant-prefix-root: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:tenants}
  redis:
    # Short-lived lock/dedup/rate-limit. Job SoT stays in PostgreSQL.
    coordination:
      enabled: ${ACTENORA_REDIS_COORDINATION_ENABLED:false}
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:headers}
    cors:
      allowed-origins: ${ACTENORA_CORS_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${ACTENORA_RATE_LIMIT_ENABLED:true}
      max-requests: ${ACTENORA_RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${ACTENORA_RATE_LIMIT_WINDOW_SECONDS:60}
    signed-url:
      max-ttl-seconds: ${ACTENORA_SIGNED_URL_MAX_TTL_SECONDS:900}
      default-ttl-seconds: ${ACTENORA_SIGNED_URL_DEFAULT_TTL_SECONDS:300}
    retention:
      audit-retention-days: ${ACTENORA_AUDIT_RETENTION_DAYS:2555}
  ai:
    provider:
      # offline (local only) | nanobaseai — public surfaces never expose third-party stack names
      # offline/mock = MockLocalProvider. nanobaseai = OpenAI-compatible chat/completions at base-url.
      # Do not point base-url at ai-orchestrator (health-only; no /v1/chat/completions).
      kind: ${ACTENORA_AI_PROVIDER_KIND:offline}
      base-url: ${ACTENORA_AI_PROVIDER_BASE_URL:http://127.0.0.1:8010}
      connect-timeout: ${ACTENORA_AI_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${ACTENORA_AI_PROVIDER_READ_TIMEOUT:7200s}
      max-concurrency: ${ACTENORA_AI_PROVIDER_MAX_CONCURRENCY:4}
      max-concurrency-extraction: ${ACTENORA_AI_PROVIDER_MAX_CONCURRENCY_EXTRACTION:2}
      max-concurrency-final: ${ACTENORA_AI_PROVIDER_MAX_CONCURRENCY_FINAL:1}
      # Distinct small extractor served-model id (empty = mock FastExtraction seed)
      fast-extraction-served-model-id: ${ACTENORA_AI_PROVIDER_FAST_EXTRACTION_SERVED_MODEL_ID:}
      fast-base-url: ${ACTENORA_AI_FAST_BASE_URL:}
      final-base-url: ${ACTENORA_AI_FINAL_BASE_URL:}
      final-served-model-id: ${ACTENORA_AI_PROVIDER_FINAL_SERVED_MODEL_ID:}
      rate-limit-per-minute: ${ACTENORA_AI_PROVIDER_RATE_LIMIT_PER_MINUTE:60}
      streaming-enabled: ${ACTENORA_AI_PROVIDER_STREAMING_ENABLED:true}
      served-model-ids: ${ACTENORA_AI_PROVIDER_SERVED_MODEL_IDS:nanobaseai-primary,nanobaseai-local}
      max-attempts: ${ACTENORA_AI_PROVIDER_MAX_ATTEMPTS:5}
    pipeline:
      # staged = stage queues + DAG; legacy = monolithic ExtractionPipelineService
      mode: ${ACTENORA_AI_PIPELINE_MODE:staged}
      # Runtime-selectable finalization. Editorial preserves validated structured items and
      # uses one bounded model call for the executive summary only.
      finalization-mode: ${ACTENORA_AI_FINALIZATION_MODE:editorial}
      finalization-prompt-resource: ${ACTENORA_AI_FINALIZATION_PROMPT_RESOURCE:/aiprocessing/prompts/editorial-summary.v1.txt}
      finalization-prompt-version-id: ${ACTENORA_AI_FINALIZATION_PROMPT_VERSION:pv-meeting-editorial-summary-v1}
      finalization-schema-version: ${ACTENORA_AI_FINALIZATION_SCHEMA:meeting.editorial-summary.v1}
      finalization-task-type: ${ACTENORA_AI_FINALIZATION_TASK_TYPE:FINAL_NOTE}
      finalization-max-output-tokens: ${ACTENORA_AI_FINALIZATION_MAX_OUTPUT_TOKENS:768}
      finalization-timeout-seconds: ${ACTENORA_AI_FINALIZATION_TIMEOUT_SECONDS:1800}
      finalization-failure-mode: ${ACTENORA_AI_FINALIZATION_FAILURE_MODE:deterministic}
    worker:
      enabled: ${ACTENORA_AI_WORKER_ENABLED:true}
      poll-interval: ${ACTENORA_AI_WORKER_POLL_INTERVAL:PT15S}
      # Re-queue RUNNING jobs abandoned after worker/process loss.
      # Must exceed longest end-to-end minutes pipeline (multi-hour transcripts).
      stale-running-after: ${ACTENORA_AI_WORKER_STALE_RUNNING_AFTER:PT24H}
      # Single-instance: requeue all RUNNING jobs on boot (in-memory work is gone).
      # Set false for multi-replica until lease/heartbeat ownership exists.
      reclaim-orphans-on-startup: ${ACTENORA_AI_WORKER_RECLAIM_ORPHANS_ON_STARTUP:true}
    routing:
      # false = FAZ 12 capability route stays authoritative, no routing/provenance audit
      enabled: ${ACTENORA_AI_ROUTING_ENABLED:true}
      # champion/challenger shadow; never replaces the production result, consensus stays OFF
      shadow-execution-enabled: ${ACTENORA_AI_ROUTING_SHADOW_ENABLED:false}
  meeting:
    quality:
      synthesis-fallback-confidence-cap: ${ACTENORA_MEETING_QUALITY_SYNTHESIS_FALLBACK_CAP:0.65}
      audit-fallback-confidence-cap: ${ACTENORA_MEETING_QUALITY_AUDIT_FALLBACK_CAP:0.55}
      double-fallback-confidence-cap: ${ACTENORA_MEETING_QUALITY_DOUBLE_FALLBACK_CAP:0.45}
      manual-review-on-any-fallback: ${ACTENORA_MEETING_QUALITY_MANUAL_REVIEW_ON_FALLBACK:true}
    signal-gate:
      enabled: ${ACTENORA_MEETING_SIGNAL_GATE_ENABLED:true}
      mode: ${ACTENORA_MEETING_SIGNAL_GATE_MODE:adaptive}
      threshold: ${ACTENORA_MEETING_SIGNAL_GATE_THRESHOLD:4.5}
      continuation-aware: ${ACTENORA_MEETING_SIGNAL_GATE_CONTINUATION_AWARE:true}
      semantic-repetition-enabled: ${ACTENORA_MEETING_SIGNAL_GATE_SEMANTIC_REPETITION:true}
      hard-marker-shortcut-enabled: ${ACTENORA_MEETING_SIGNAL_GATE_HARD_MARKER:true}
      shadow-mode: ${ACTENORA_MEETING_SIGNAL_GATE_SHADOW_MODE:false}
      classifier-enabled: ${ACTENORA_MEETING_SIGNAL_GATE_CLASSIFIER_ENABLED:true}
      uncertain-band: ${ACTENORA_MEETING_SIGNAL_GATE_UNCERTAIN_BAND:2.0}
      policy-version: ${ACTENORA_MEETING_SIGNAL_GATE_POLICY_VERSION:adaptive-gate-v3}
    speech-signals:
      dictionary-version: ${ACTENORA_MEETING_SPEECH_DICTIONARY_VERSION:tr-en-v1}
  knowledge:
    embedding:
      # hash = offline deterministic vectors; openai-compatible = POST /v1/embeddings
      mode: ${ACTENORA_KNOWLEDGE_EMBEDDING_MODE:hash}
      dimensions: ${ACTENORA_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
      base-url: ${ACTENORA_KNOWLEDGE_EMBEDDING_BASE_URL:}
      model-id: ${ACTENORA_KNOWLEDGE_EMBEDDING_MODEL_ID:}
      api-key: ${ACTENORA_KNOWLEDGE_EMBEDDING_API_KEY:}
  delivery:
    webhook:
      # Shared secret for provider delivery confirmation callbacks (FAZ 30)
      secret: ${ACTENORA_DELIVERY_WEBHOOK_SECRET:local-delivery-webhook-secret}
    portal-link:
      secret: ${ACTENORA_PORTAL_LINK_SECRET:actenora-local-portal-secret}
      base-url: ${ACTENORA_PORTAL_LINK_BASE_URL:https://portal.nanobase.ai/easymeeting}
    mail:
      # mailhog (local) | microsoft-graph (prod CERTIFICATE path)
      provider: ${ACTENORA_DELIVERY_MAIL_PROVIDER:mailhog}
      from: ${ACTENORA_DELIVERY_MAIL_FROM:noreply@actenora.local}
      graph-sender: ${ACTENORA_DELIVERY_GRAPH_SENDER:}
  portal:
    business-zone: ${ACTENORA_PORTAL_BUSINESS_ZONE:Europe/Istanbul}
    auth:
      # headers = X-Actenora-* operator identity (local); msal = Entra Bearer via SPA (prod)
      mode: ${ACTENORA_PORTAL_AUTH_MODE:headers}
    my-work:
      upcoming-window: ${ACTENORA_PORTAL_MY_WORK_UPCOMING_WINDOW:P7D}
      recent-commitment-limit: ${ACTENORA_PORTAL_MY_WORK_RECENT_COMMITMENT_LIMIT:12}
      date-only-deadline-time: ${ACTENORA_PORTAL_MY_WORK_DATE_ONLY_DEADLINE_TIME:23:59:59}
    meeting-prep:
      agenda-source-order: ${ACTENORA_PORTAL_MEETING_PREP_AGENDA_SOURCE_ORDER:OPEN_QUESTION,RISK,ACTION_ITEM,COMMITMENT}
    meeting-question:
      prompt-resource: ${ACTENORA_PORTAL_MEETING_QUESTION_PROMPT_RESOURCE:classpath:/portal/prompts/meeting-question.v1.txt}
      task-type: ${ACTENORA_PORTAL_MEETING_QUESTION_TASK_TYPE:MEETING_QUESTION}
      prompt-version: ${ACTENORA_PORTAL_MEETING_QUESTION_PROMPT_VERSION:meeting-question.v1}
      schema-version: ${ACTENORA_PORTAL_MEETING_QUESTION_SCHEMA_VERSION:meeting-question.schema.v1}
      evidence-limit: ${ACTENORA_PORTAL_MEETING_QUESTION_EVIDENCE_LIMIT:24}
      max-output-tokens: ${ACTENORA_PORTAL_MEETING_QUESTION_MAX_OUTPUT_TOKENS:768}
      timeout-seconds: ${ACTENORA_PORTAL_MEETING_QUESTION_TIMEOUT_SECONDS:45}
    global-search:
      default-limit: ${ACTENORA_PORTAL_GLOBAL_SEARCH_DEFAULT_LIMIT:20}
      max-limit: ${ACTENORA_PORTAL_GLOBAL_SEARCH_MAX_LIMIT:50}
    outlook-draft:
      subject-template: ${ACTENORA_PORTAL_OUTLOOK_DRAFT_SUBJECT_TEMPLATE:classpath:/portal/templates/outlook-followup-subject.v1.txt}
      html-template: ${ACTENORA_PORTAL_OUTLOOK_DRAFT_HTML_TEMPLATE:classpath:/portal/templates/outlook-followup.v1.html}
      action-template: ${ACTENORA_PORTAL_OUTLOOK_DRAFT_ACTION_TEMPLATE:classpath:/portal/templates/outlook-followup-action.v1.html}
  microsoft-graph:
    # Bounded context + its Graph notification webhook are disabled locally by default (FAZ 32)
    enabled: ${ACTENORA_MICROSOFT_GRAPH_ENABLED:false}
    auth-mode: ${ACTENORA_MICROSOFT_GRAPH_AUTH_MODE:${MICROSOFT_GRAPH_AUTH_MODE:CLIENT_SECRET}}
    tenant-id: ${ACTENORA_MICROSOFT_GRAPH_TENANT_ID:${MICROSOFT_TENANT_ID:}}
    client-id: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_ID:${MICROSOFT_CLIENT_ID:}}
    client-secret: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_SECRET:${MICROSOFT_CLIENT_SECRET:}}
    certificate-pem-path: ${ACTENORA_MICROSOFT_GRAPH_CERTIFICATE_PEM_PATH:${MICROSOFT_CERTIFICATE_PEM_PATH:}}
    private-key-pem-path: ${ACTENORA_MICROSOFT_GRAPH_PRIVATE_KEY_PEM_PATH:${MICROSOFT_PRIVATE_KEY_PEM_PATH:}}
    graph-base-url: ${MICROSOFT_GRAPH_BASE_URL:https://graph.microsoft.com}
    authority-host: ${MICROSOFT_AUTHORITY_HOST:https://login.microsoftonline.com}
    workers-enabled: ${ACTENORA_MICROSOFT_GRAPH_WORKERS_ENABLED:true}
    auto-enable-transcription: ${ACTENORA_MICROSOFT_GRAPH_AUTO_ENABLE_TRANSCRIPTION:true}
    default-mailbox-user-id: ${ACTENORA_MICROSOFT_GRAPH_DEFAULT_MAILBOX_USER_ID:}
    transcript-poll-interval: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_INTERVAL:PT5M}
    transcript-poll-max-attempts: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_MAX_ATTEMPTS:24}
    transcript-poll-max-age: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_MAX_AGE:PT48H}
    transcript-poll-stale-claim: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_STALE_CLAIM:PT15M}
    transcript-poll-batch-size: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_BATCH_SIZE:50}
    transcript-poll-backoff-base: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_BACKOFF_BASE:PT1M}
    transcript-poll-backoff-cap: ${ACTENORA_MICROSOFT_GRAPH_TRANSCRIPT_POLL_BACKOFF_CAP:PT1H}
    reconcile-interval: ${ACTENORA_MICROSOFT_GRAPH_RECONCILE_INTERVAL:PT30M}
    mailbox-sync-on-startup: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_ON_STARTUP:true}
    mailbox-sync-enabled: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_ENABLED:true}
    mailbox-sync-interval: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_INTERVAL:PT15M}
    # Initial calendarView/delta window (past + future). Existing deltaLink ignores these until cursor reset.
    calendar-sync-lookback: ${ACTENORA_MICROSOFT_GRAPH_CALENDAR_SYNC_LOOKBACK:P90D}
    calendar-sync-lookahead: ${ACTENORA_MICROSOFT_GRAPH_CALENDAR_SYNC_LOOKAHEAD:P180D}
    mailbox-sync-recover-empty-delta: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RECOVER_EMPTY_DELTA:true}
    mailbox-sync-retry-interval: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RETRY_INTERVAL:PT1M}
    mailbox-sync-retry-backoff-base: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RETRY_BACKOFF_BASE:PT1M}
    mailbox-sync-retry-backoff-cap: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RETRY_BACKOFF_CAP:PT15M}
    mailbox-sync-retry-stale-claim: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RETRY_STALE_CLAIM:PT5M}
    mailbox-sync-retry-batch-size: ${ACTENORA_MICROSOFT_GRAPH_MAILBOX_SYNC_RETRY_BATCH_SIZE:20}
    subscription-renew-before: ${ACTENORA_MICROSOFT_GRAPH_SUBSCRIPTION_RENEW_BEFORE:PT6H}
    subscription-renew-window: ${ACTENORA_MICROSOFT_GRAPH_SUBSCRIPTION_RENEW_WINDOW:PT48H}
    mail:
      max-per-window: ${ACTENORA_MICROSOFT_GRAPH_MAIL_MAX_PER_WINDOW:100}
      window: ${ACTENORA_MICROSOFT_GRAPH_MAIL_WINDOW:PT1M}
    circuit-breaker:
      failure-threshold: ${ACTENORA_MICROSOFT_GRAPH_CIRCUIT_FAILURE_THRESHOLD:10}
      open-duration: ${ACTENORA_MICROSOFT_GRAPH_CIRCUIT_OPEN_DURATION:PT30S}
    webhook:
      # clientState echoed by Graph in every change/lifecycle notification (FAZ 32)
      client-state: ${ACTENORA_MICROSOFT_GRAPH_CLIENT_STATE:local-graph-client-state}
  transcript:
    # embedded = in-process module (default); remote = HTTP proxy to transcript-worker (FAZ 26)
    mode: ${ACTENORA_TRANSCRIPT_MODE:embedded}
    remote:
      base-url: ${TRANSCRIPT_WORKER_BASE_URL:http://localhost:8081}
      connect-timeout: ${TRANSCRIPT_REMOTE_CONNECT_TIMEOUT:2s}
      read-timeout: ${TRANSCRIPT_REMOTE_READ_TIMEOUT:30s}
      max-retries: ${TRANSCRIPT_REMOTE_MAX_RETRIES:3}
      retry-backoff: ${TRANSCRIPT_REMOTE_RETRY_BACKOFF:200ms}
  messaging:
    # inmemory (default) | jdbc-rabbit (Wave 1 durable outbox relay)
    mode: ${ACTENORA_MESSAGING_MODE:inmemory}
    jdbc:
      schema: ${ACTENORA_MESSAGING_JDBC_SCHEMA:operations}
    relay:
      max-queue-depth: ${ACTENORA_MESSAGING_RELAY_MAX_QUEUE_DEPTH:10000}
  env: ${ACTENORA_ENV:local}
  allow-default-secrets: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Local / Docker Compose profile (FAZ 2).
# Default credentials are allowed ONLY on this profile.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:actenora}}
    username: ${POSTGRES_USER:actenora}
    password: ${POSTGRES_PASSWORD:actenora_local_change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:actenora}
    password: ${RABBITMQ_PASSWORD:actenora_local_change_me}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  flyway:
    enabled: true

management:
  health:
    db:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,rabbit,redis
        liveness:
          include: livenessState

actenora:
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:actenora_minio}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:actenora_minio_change_me}
    bucket: ${OBJECT_STORAGE_BUCKET:actenora}
    tenant-prefix-root: ${OBJECT_STORAGE_TENANT_PREFIX_ROOT:tenants}
    enabled: ${ACTENORA_OBJECT_STORAGE_ENABLED:true}
  allow-default-secrets: true
  env: ${ACTENORA_ENV:local}
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:headers}
    cors:
      allowed-origins: ${ACTENORA_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://localhost:5173}
    rate-limit:
      enabled: true
      max-requests: 300
      window-seconds: 60
    signed-url:
      max-ttl-seconds: 900
      default-ttl-seconds: 300
    retention:
      audit-retention-days: 2555

---
# Opt-in Entra sign-in against a real tenant without leaving the local profile:
#   SPRING_PROFILES_ACTIVE=local,entra-local
# Kept separate so the plain local profile never boots a JWT decoder with a blank issuer.
spring:
  config:
    activate:
      on-profile: entra-local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ACTENORA_ENTRA_ISSUER_URI}
          audiences: ${ACTENORA_ENTRA_AUDIENCE}

actenora:
  security:
    auth:
      mode: ${ACTENORA_AUTH_MODE:entra}
  portal:
    auth:
      mode: ${ACTENORA_PORTAL_AUTH_MODE:msal}

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap + build + SBOM
        run: ./scripts/ci-build
      - name: Lint + test
        run: ./scripts/ci-test
      - name: Upload timings & SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actenora-ci-artifacts
          path: |
            artifacts/local/timings.tsv
            artifacts/sbom/

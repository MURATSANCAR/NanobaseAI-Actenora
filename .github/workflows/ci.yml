name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap + build + SBOM
        run: ./scripts/ci-build
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan
        run: ./scripts/scan-secrets
      - name: Dependency vulnerability scan
        run: ./scripts/scan-dependencies
      - name: Install Semgrep
        run: |
          pip install --user "semgrep==1.172.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          semgrep --version
      - name: Semgrep SAST
        run: ./scripts/scan-semgrep
      - name: Lint + test
        run: ./scripts/ci-test
      - name: Upload timings & SBOM & security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actenora-ci-artifacts
          path: |
            artifacts/local/timings.tsv
            artifacts/sbom/
            artifacts/security/

  architecture-flyway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Clean + ArchUnit + Flyway uniqueness
        run: |
          ./mvnw -pl apps/platform-backend -am clean test \
            -Dtest=ModularMonolithArchUnitTest,ModulithArchitectureTest,FlywayMigrationUniquenessTest \
            -Dsurefire.failIfNoSpecifiedTests=false

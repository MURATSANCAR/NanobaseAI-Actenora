# EasyMeeting SPA — include inside portal.nanobase.ai server block.
# Public path is /easymeeting/; /actenora/ redirects for old bookmarks.

location = /actenora {
    return 301 /easymeeting/;
}

location ^~ /actenora/ {
    rewrite ^/actenora/(.*)$ /easymeeting/$1 permanent;
}

location ^~ /easymeeting/ {
    root /data/nanobaseai-mobile/portal/dist;
    try_files $uri $uri/ /easymeeting/index.html;
}
